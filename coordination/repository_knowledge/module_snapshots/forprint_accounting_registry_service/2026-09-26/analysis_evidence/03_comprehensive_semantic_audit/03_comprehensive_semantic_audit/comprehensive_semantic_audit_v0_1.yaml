semantic_findings:
- finding_id: ACC-F01
  severity: HIGH
  classification: STRATEGIC_TARGET_AHEAD_OF_IMPLEMENTATION
  summary: Current repository is a v0.5 offline 1C sandbox/staging foundation, while Blueprint target has expanded to a P0 operational/commercial accounting registry with receivables,
    supplier documents, settlements and mature accounting workflows.
  evidence:
  - coordination/status/current_status.md
  - coordination/module_policy/forprint_accounting_registry_service/module_policy.md
  - coordination/human_intent/modules/forprint_accounting_registry_service.yaml
  - coordination/roadmaps/details/forprint_system_blueprint/portfolio_module_roadmap_approval_matrix_v0_1.yaml
  disposition: ROADMAP_RECONCILIATION_REQUIRED_NO_IMPLEMENTATION_NOW
- finding_id: ACC-F02
  severity: HIGH
  classification: CONTRACT_AUTHORITY_DRIFT
  summary: Repository declares ForPrint Library as future canonical inter-module contract truth, but current Blueprint assigns versioned inter-module contract lifecycle/catalog authority
    to forprint_contract_registry.
  evidence:
  - forprint_module_manifest.yaml
  - contracts/placeholders/accounting.invoice_request.v1.yaml
  - contracts/placeholders/accounting.payment_status_reference.v1.yaml
  - coordination/global_policy/ecosystem_module_map.md
  - coordination/module_policy/module_policy_index.yaml
  disposition: DEFER_TO_CROSS_PROJECT_CONTRACT_AUTHORITY_RECONCILIATION
- finding_id: ACC-F03
  severity: HIGH
  classification: ACTIVE_TESTED_SEMANTIC_RESIDUE
  summary: Generic Counterparty and Product models are tracked and tested as accounting projections but contain CRM/Operations/Logistics/Library/Calculator-like semantics including contacts/channels,
    delivery profile, manager/tags, price-group and price/production-affecting product attributes.
  evidence:
  - app/forprint_accounting_registry_service/models/counterparty.py
  - app/forprint_accounting_registry_service/models/product.py
  - tests/unit/test_counterparty_model.py
  - tests/unit/test_product_model.py
  - docs/development/model_naming_rules.md
  - coordination/module_policy/forprint_accounting_registry_service/goods_receipt_automation_target_state_v0_1_20260826.md
  disposition: OWNERSHIP_RECONCILIATION_REQUIRED_PRESERVE_AS_EVIDENCE
- finding_id: ACC-F04
  severity: HIGH
  classification: VALIDATOR_SEMANTIC_BLIND_SPOT
  summary: Boundary checker forbids generic Product/Client/Order names only in storage/models.py and one_c_io/*.py, while generic Product and Counterparty models live in models/ and
    therefore still pass the reported boundary checks.
  evidence:
  - scripts/run_accounting_registry_checks.py
  - app/forprint_accounting_registry_service/models/counterparty.py
  - app/forprint_accounting_registry_service/models/product.py
  - reports/accounting_registry_check_report.json
  disposition: VALIDATOR_RECONCILIATION_CANDIDATE
- finding_id: ACC-F05
  severity: MEDIUM
  classification: IDENTITY_ALIAS_DRIFT
  summary: Current repository manifest and local placeholder contract text still reference historical forprint_operational_registry naming although Blueprint canonical ID is forprint_operations_control_registry.
  evidence:
  - forprint_module_manifest.yaml
  - contracts/placeholders/accounting.payment_status_reference.v1.yaml
  - coordination/machine/module_identity_registry.yaml
  disposition: BOUNDED_IDENTITY_RECONCILIATION_CANDIDATE
- finding_id: ACC-F06
  severity: HIGH
  classification: DECLARED_OWNERSHIP_EXCEEDS_IMPLEMENTED_DOMAIN_RUNTIME
  summary: Manifest and Blueprint declare invoice/payment/accounting truth ownership, but current persistent implementation provides AccountingDocument plus InvoiceAccountingReference
    and PaymentAccountingReference shells rather than full invoice/payment or receivable lifecycles.
  evidence:
  - forprint_module_manifest.yaml
  - app/forprint_accounting_registry_service/storage/models.py
  - coordination/machine/data_objects.yaml
  - coordination/human_intent/modules/forprint_accounting_registry_service.yaml
  disposition: CAPABILITY_CURRENTNESS_RECONCILIATION_REQUIRED
- finding_id: ACC-F07
  severity: HIGH
  classification: ONE_C_CAPABILITY_NAMING_OVERSTATEMENT
  summary: v0.4/v0.5 'direct DB/direct I/O' surfaces are fixture-driven inspection abstractions; binary/database-like .1CD/.dt/.db sources are explicitly unsupported and no real 1C connection
    is implemented.
  evidence:
  - app/forprint_accounting_registry_service/one_c_io/direct_db.py
  - app/forprint_accounting_registry_service/one_c_io/schema_probe.py
  - docs/architecture/one_c_sandbox_direct_io.md
  disposition: DOCUMENT_CURRENTNESS_AND_ROADMAP_REFINEMENT_CANDIDATE
- finding_id: ACC-F08
  severity: HIGH
  classification: SANDBOX_WRITE_SIMULATION_SEMANTIC_MISMATCH
  summary: Non-dry-run sandbox write experiment can return applied=true after safety checks without executing the declared operations against the working copy; current semantics represent
    authorization/simulation, not an actual write.
  evidence:
  - app/forprint_accounting_registry_service/one_c_io/sandbox_write.py
  - tests/unit/test_one_c_sandbox_write_hardening.py
  disposition: SEMANTIC_NAMING_AND_TEST_RECONCILIATION_CANDIDATE
- finding_id: ACC-F09
  severity: HIGH
  classification: SOURCE_PROVENANCE_BINDING_GAP
  summary: Import pipeline validates a OneCSandboxSource object but accepts a separate export_path without proving the path corresponds to the validated source; raw snapshot file_hash
    is also not populated in the pipeline.
  evidence:
  - app/forprint_accounting_registry_service/one_c_io/import_pipeline.py
  - app/forprint_accounting_registry_service/storage/models.py
  - app/forprint_accounting_registry_service/one_c_io/test_database_registry.py
  disposition: FUTURE_SECURITY_AND_PROVENANCE_HARDENING_CANDIDATE
- finding_id: ACC-F10
  severity: MEDIUM
  classification: SANITIZATION_TRUSTS_DECLARED_METADATA
  summary: Sanitization layer validates metadata flags rather than sanitizing content; parsers commonly default batches to sanitized/non-production. This is acceptable for current controlled
    fixtures but must not be interpreted as proof that arbitrary external files are safe.
  evidence:
  - app/forprint_accounting_registry_service/one_c_io/sanitization.py
