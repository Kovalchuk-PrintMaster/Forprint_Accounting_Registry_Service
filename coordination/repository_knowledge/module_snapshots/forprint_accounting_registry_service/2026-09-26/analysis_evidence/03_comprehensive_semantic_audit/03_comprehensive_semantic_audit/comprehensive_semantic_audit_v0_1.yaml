  severity: MEDIUM
  classification: STATUS_SURFACE_STALENESS
  summary: coordination/status/current_status.yaml contains literal {now}/{branch}/{commit} placeholders and marks checks pending, while repository carries an older generated check report
    with status OK; neither should be treated as a fresh authoritative current verification.
