  - coordination/status/current_status.yaml
  - coordination/status/current_status.md
  - reports/accounting_registry_check_report.json
  disposition: CURRENT_STATUS_GENERATION_RECONCILIATION_CANDIDATE
- finding_id: ACC-F12
  severity: MEDIUM
  classification: OPERATOR_CHECK_SIDE_EFFECT
  summary: Make governance-check invokes blueprint-pull and status-report; therefore a nominal check may mutate sibling Blueprint checkout and generated report files instead of being
    purely non-mutating validation.
  evidence:
