  - generic Counterparty/Product semantic residue
  - Contract Registry versus historical Library contract authority
  - historical Operations module alias
  - 1C capability naming/currentness
  - validator coverage semantics
  - status/operator-surface currentness
  next_action: BUILD_CROSS_PROJECT_BLUEPRINT_RECONCILIATION_PACKET
